# Options for the it87 hardware monitoring driver
# ignore_resource_conflict=1: Required on UGREEN NAS devices where ACPI claims the I/O ports
# force_activate=1: Required on UGREEN iDX6011 where the BIOS leaves the EC logical device
#                   deactivated (IT8622E / OEM ID 0x5571 at ioreg 0x4e).
#                   On iDX6011 this is applied automatically via DMI detection; the explicit
#                   parameter is available as a fallback when DMI matching does not trigger.
options it87 ignore_resource_conflict=1
